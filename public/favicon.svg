<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Life Calendar">
  <title>Life Calendar</title>

  <!-- kafelek -->
  <rect width="64" height="64" rx="14" fill="#0F2E35"/>

  <!-- oś życia: wychodzi poza górną i dolną krawędź -->
  <path d="M32 0 V64" stroke="#6F9089" stroke-width="4"/>

  <!-- wydarzenia: nierówne odstępy, różna waga -->
  <circle cx="32" cy="11" r="5"   fill="#E8E2D4"/>
  <circle cx="32" cy="27" r="8"   fill="#E3A24A"/>
  <circle cx="32" cy="48" r="6.5" fill="#E8E2D4"/>
</svg>
