<!DOCTYPE html>
<html lang="pl" data-theme="granat">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Door Callendar — dodawanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Cztery kierunki. Wspólna zasada: jeden akcent, reszta cicha. */

  /* Granat — monochromia: wszystko niebieskie, akcent to po prostu
     jaśniejszy odcień tego samego. Najspokojniejsza z całej stawki. */
  [data-theme="granat"]{
    --bg:#0C1521; --surface:#121E2E; --raised:#1A2A3E;
    --text:#DDE6EF; --muted:#6E8299; --dim:rgba(221,230,239,.44);
    --line:rgba(110,130,153,.22); --accent:#8FB8D9; --accent-line:rgba(143,184,217,.44);
    --on-accent:#0E1826; --w1:#6E8299; --w2:#7C9BBB; --w3:#8FB8D9;
  }
  /* Lazur — jasny błękit z granatowym akcentem. Czytelny w słońcu. */
  [data-theme="lazur"]{
    --bg:#ECF1F5; --surface:#FAFCFD; --raised:#E1E9F0;
    --text:#1B2A3A; --muted:#6B7C8E; --dim:rgba(27,42,58,.5);
    --line:rgba(27,42,58,.11); --accent:#2C5D8F; --accent-line:rgba(44,93,143,.4);
    --on-accent:#F7FAFC; --w1:#93A3B4; --w2:#5E7EA0; --w3:#2C5D8F;
  }
  /* Atrament i mosiądz — grafit z ciepłym metalem. Wieczorna elegancja. */
  [data-theme="atrament"]{
    --bg:#12151B; --surface:#191D26; --raised:#222733;
    --text:#E7E4DC; --muted:#79808F; --dim:rgba(231,228,220,.44);
    --line:rgba(121,128,143,.22); --accent:#C7A868; --accent-line:rgba(199,168,104,.45);
    --on-accent:#171922; --w1:#79808F; --w2:#9E8F63; --w3:#C7A868;
  }
  /* Porcelana — papier i atramentowa zieleń. Dzienna, spokojna. */
  [data-theme="porcelana"]{
    --bg:#F1F0EC; --surface:#FBFAF8; --raised:#E8E6E0;
    --text:#232A2C; --muted:#727B7C; --dim:rgba(35,42,44,.5);
    --line:rgba(35,42,44,.12); --accent:#1F5B63; --accent-line:rgba(31,91,99,.38);
    --on-accent:#F8F8F6; --w1:#9AA3A3; --w2:#8C7A46; --w3:#1F5B63;
  }
  /* Nokturn — śliwkowa czerń i przygaszony liliowy. Chłodna, nowoczesna. */
  [data-theme="nokturn"]{
    --bg:#15121B; --surface:#1D1926; --raised:#282232;
    --text:#E3DFE9; --muted:#847C93; --dim:rgba(227,223,233,.44);
    --line:rgba(132,124,147,.2); --accent:#B7A2CE; --accent-line:rgba(183,162,206,.42);
    --on-accent:#1A1622; --w1:#847C93; --w2:#9C8FA8; --w3:#B7A2CE;
  }
  /* Petrol — dotychczasowa, do porównania. */
  [data-theme="petrol"]{
    --bg:#0F2E35; --surface:#143A43; --raised:#1B4750;
    --text:#E8E2D4; --muted:#6F9089; --dim:rgba(232,226,212,.5);
    --line:rgba(111,144,137,.26); --accent:#E3A24A; --accent-line:rgba(227,162,74,.4);
    --on-accent:#14262B; --w1:#6F9089; --w2:#C9B458; --w3:#E3A24A;
  }
  :root{ --row:44px; }

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{transition:background .25s,color .25s}
  body{
    color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:16px;line-height:1.5;padding:22px 18px 56px;
    max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased;
  }
  .themes{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}
  .themes button{
    display:flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer;
  }
  .themes button[aria-pressed=true]{border-color:var(--accent-line);color:var(--text)}
  .themes .sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(128,128,128,.3)}
  .mark{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:23px;margin:0;letter-spacing:-.01em}

  label.field{display:block;margin:0 0 7px;font-size:11.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);font-weight:600}

  #title{
    width:100%;padding:15px 16px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;
    color:var(--text);font:inherit;font-size:18px;margin-bottom:22px;
  }
  #title:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  #title::placeholder{color:var(--dim)}

  .block{margin-bottom:20px}
  .cols{display:flex;gap:9px}
  .col{flex:1;min-width:0}
  .col.n{flex:0 0 74px}

  .wheel{
    position:relative;height:calc(var(--row)*5);
    background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  .wheel::before{
    content:"";position:absolute;left:0;right:0;top:calc(var(--row)*2);height:var(--row);
    background:var(--raised);
    border-top:1px solid var(--accent-line);border-bottom:1px solid var(--accent-line);
    pointer-events:none;
  }
  .wheel::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(var(--surface),transparent 34%,transparent 66%,var(--surface));
  }
  .wheel ul{
    position:relative;z-index:1;margin:0;padding:calc(var(--row)*2) 0;list-style:none;
    height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .wheel ul::-webkit-scrollbar{display:none}
  .wheel li{
    height:var(--row);line-height:var(--row);scroll-snap-align:center;text-align:center;
    font-size:16px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:0 6px;transition:color .12s;cursor:pointer;
  }
  .wheel li.on{color:var(--text);font-weight:600}
  .wheel.mono li{font-family:"IBM Plex Mono",monospace;font-size:19px}
  .wheel.dis{opacity:.32}
  .wheel.dis ul{pointer-events:none}

  .allday{display:flex;align-items:center;gap:10px;margin-top:11px;
    font-size:14px;color:var(--dim);cursor:pointer;user-select:none}
  .allday input{accent-color:var(--accent);width:18px;height:18px}

  .seg{display:flex;gap:7px}
  .seg button{
    flex:1;padding:12px 6px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;color:var(--dim);font:inherit;font-size:14px;cursor:pointer;
  }
  .seg button[aria-pressed=true]{
    background:var(--raised);border-color:var(--accent-line);color:var(--text);font-weight:600;
  }
  .seg .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
    vertical-align:1px;background:var(--muted)}
  .seg button:nth-child(2) .dot{background:var(--w2)}
  .seg button:nth-child(3) .dot{background:var(--accent)}

  .summary{background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:17px;margin-top:26px}
  .sentence{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:19px;
    line-height:1.4;margin:0 0 5px}
  .sentence .t{color:var(--accent)}
  .sub{font-size:13.5px;color:var(--dim);margin:0}
  .next{margin:15px 0 0;padding-top:14px;border-top:1px solid var(--line);
    list-style:none;display:grid;gap:7px}
  .next li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
  .next .u{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim)}
  .next .hd{color:var(--muted);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase}
  .readout{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);word-break:break-all}

  .save{width:100%;margin-top:20px;padding:16px;border:none;border-radius:12px;
    background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;font-size:17px;cursor:pointer}
  .save:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>

<div class="themes" id="themes">
  <button data-t="granat"    aria-pressed="true"><span class="sw" style="background:#8FB8D9"></span>Granat</button>
  <button data-t="lazur"     aria-pressed="false"><span class="sw" style="background:#2C5D8F"></span>Lazur</button>
  <button data-t="atrament"  aria-pressed="false"><span class="sw" style="background:#C7A868"></span>Atrament</button>
  <button data-t="porcelana" aria-pressed="false"><span class="sw" style="background:#1F5B63"></span>Porcelana</button>
  <button data-t="nokturn"   aria-pressed="false"><span class="sw" style="background:#B7A2CE"></span>Nokturn</button>
  <button data-t="petrol"    aria-pressed="false"><span class="sw" style="background:#E3A24A"></span>Petrol</button>
</div>

<div class="mark">
  <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="var(--raised)"/>
    <path d="M32 0 V64" stroke="var(--muted)" stroke-width="4"/>
    <circle cx="32" cy="11" r="5" fill="var(--text)"/>
    <circle cx="32" cy="27" r="8" fill="var(--accent)"/>
    <circle cx="32" cy="48" r="6.5" fill="var(--text)"/>
  </svg>
  <h1>Nowe wydarzenie</h1>
</div>

<label class="field" for="title">Co</label>
<input type="text" id="title" placeholder="Podlewanie" autocomplete="off" value="Podlewanie">

<div class="block">
  <label class="field">Data</label>
  <div class="cols">
    <div class="col n"><div class="wheel mono" id="w-d"><ul tabindex="0"></ul></div></div>
    <div class="col"><div class="wheel" id="w-mo"><ul tabindex="0"></ul></div></div>
    <div class="col n"><div class="wheel mono" id="w-y"><ul tabindex="0"></ul></div></div>
  </div>
</div>

<div class="block">
  <label class="field">Powtarzanie</label>
  <div class="wheel" id="w-rep"><ul tabindex="0"></ul></div>
</div>

<div class="block">
  <label class="field">Godzina</label>
  <div class="cols">
    <div class="col n"><div class="wheel mono" id="w-h"><ul tabindex="0"></ul></div></div>
    <div class="col n"><div class="wheel mono" id="w-mi"><ul tabindex="0"></ul></div></div>
    <div class="col"></div>
  </div>
  <label class="allday"><input type="checkbox" id="allday"> Cały dzień</label>
</div>

<div class="block">
  <label class="field">Przypomnienie</label>
  <div class="wheel" id="w-rem"><ul tabindex="0"></ul></div>
</div>

<div class="block">
  <label class="field">Waga</label>
  <div class="seg" id="seg">
    <button aria-pressed="true"><span class="dot"></span>Zwykłe</button>
    <button aria-pressed="false"><span class="dot"></span>Ważne</button>
    <button aria-pressed="false"><span class="dot"></span>Pilne</button>
  </div>
</div>

<div class="summary">
  <p class="sentence" id="sentence"></p>
  <p class="sub" id="sub"></p>
  <ul class="next" id="next"></ul>
  <div class="readout" id="readout"></div>
</div>

<button class="save" id="save">Zapisz</button>

<script>
const MONTHS=['styczeń','luty','marzec','kwiecień','maj','czerwiec',
  'lipiec','sierpień','wrzesień','październik','listopad','grudzień'];

/* Dni tygodnia zniknęły z listy powtarzania — data już niesie swój dzień.
   "Co tydzień" od niedzieli TO jest "w niedziele". */
const REPEAT=[
  {label:'Nie powtarza się', rrule:null},
  {label:'Codziennie',       rrule:'FREQ=DAILY'},
  {label:'Co tydzień',       rrule:'FREQ=WEEKLY'},
  {label:'Co dwa tygodnie',  rrule:'FREQ=WEEKLY;INTERVAL=2'},
  {label:'Co miesiąc',       rrule:'FREQ=MONTHLY'},
  {label:'Co trzy miesiące', rrule:'FREQ=MONTHLY;INTERVAL=3'},
  {label:'Co pół roku',      rrule:'FREQ=MONTHLY;INTERVAL=6'},
  {label:'Co rok',           rrule:'FREQ=YEARLY'},
];

const HOURS=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const MINUTES=Array.from({length:60},(_,i)=>String(i).padStart(2,'0'));

const REMIND=[
  {label:'Bez przypomnienia',min:null},
  {label:'W momencie zdarzenia',min:0},
  {label:'5 minut wcześniej',min:5},
  {label:'15 minut wcześniej',min:15},
  {label:'30 minut wcześniej',min:30},
  {label:'Godzinę wcześniej',min:60},
  {label:'2 godziny wcześniej',min:120},
  {label:'Dzień wcześniej',min:1440},
  {label:'2 dni wcześniej',min:2880},
  {label:'Tydzień wcześniej',min:10080},
];

const WEIGHTS=['Zwykłe','Ważne','Pilne'];
/* Formy, w których dzień tygodnia występuje przy powtarzaniu.
   Odmiana jest nieregularna, więc tabela zamiast obcinania końcówek. */
const DOW_PLURAL=['w niedziele','w poniedziałki','we wtorki','w środy',
  'w czwartki','w piątki','w soboty'];

const $=id=>document.getElementById(id);
const ROW=44;
const pad=n=>String(n).padStart(2,'0');

function makeWheel(el,items,initial,onChange){
  const ul=el.querySelector('ul');
  let idx=initial,lis=[];
  const mark=i=>lis.forEach((li,n)=>li.classList.toggle('on',n===i));
  function paint(list,sel){
    ul.innerHTML=list.map(t=>'<li>'+t+'</li>').join('');
    lis=[...ul.children];
    lis.forEach((li,i)=>li.addEventListener('click',()=>ul.scrollTo({top:i*ROW,behavior:'smooth'})));
    ul.scrollTop=sel*ROW; idx=sel; mark(sel);
  }
  let t;
  function settle(){
    const i=Math.max(0,Math.min(lis.length-1,Math.round(ul.scrollTop/ROW)));
    mark(i); if(i!==idx){idx=i;onChange(i)}
  }
  ul.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(settle,70)},{passive:true});
  ul.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      const n=Math.max(0,Math.min(lis.length-1,idx+(e.key==='ArrowDown'?1:-1)));
      ul.scrollTo({top:n*ROW,behavior:'smooth'});
    }
  });
  paint(items,initial);
  return{get index(){return idx},repaint:paint};
}

/* ------------------------------------------------------------------ */

const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Warsaw';
const now0=new Date();
const YEARS=Array.from({length:11},(_,i)=>String(now0.getFullYear()+i));

const state={d:now0.getDate()-1,mo:now0.getMonth(),y:0,
  rep:0,h:7,mi:0,rem:3,allDay:false,weight:0,theme:'granat'};

const daysIn=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const dayList=(y,m)=>Array.from({length:daysIn(y,m)},(_,i)=>String(i+1));

const wD=makeWheel($('w-d'),dayList(+YEARS[state.y],state.mo),state.d,i=>{state.d=i;render()});
makeWheel($('w-mo'),MONTHS,state.mo,i=>{state.mo=i;syncDays();render()});
makeWheel($('w-y'),YEARS,state.y,i=>{state.y=i;syncDays();render()});
makeWheel($('w-rep'),REPEAT.map(r=>r.label),state.rep,i=>{state.rep=i;render()});
makeWheel($('w-h'),HOURS,state.h,i=>{state.h=i;render()});
makeWheel($('w-mi'),MINUTES,state.mi,i=>{state.mi=i;render()});
makeWheel($('w-rem'),REMIND.map(r=>r.label),state.rem,i=>{state.rem=i;render()});

/* Luty ma 28 albo 29 dni — lista przebudowuje się po zmianie miesiąca lub roku. */
function syncDays(){
  const max=daysIn(+YEARS[state.y],state.mo);
  if(state.d>max-1)state.d=max-1;
  wD.repaint(dayList(+YEARS[state.y],state.mo),state.d);
}

$('title').addEventListener('input',render);
$('allday').addEventListener('change',e=>{
  state.allDay=e.target.checked;
  $('w-h').classList.toggle('dis',state.allDay);
  $('w-mi').classList.toggle('dis',state.allDay);
  render();
});
$('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const btns=[...$('seg').children];
  state.weight=btns.indexOf(b);
  btns.forEach((x,i)=>x.setAttribute('aria-pressed',String(i===state.weight)));
  render();
});

/* ------------------------------------------------------------------ */

const carrier=c=>new Date(Date.UTC(c.y,c.m-1,c.d,c.h||0,c.min||0));
const fromC=d=>({y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),min:d.getUTCMinutes()});
function addDays(c,n){const d=carrier(c);d.setUTCDate(d.getUTCDate()+n);return fromC(d)}
function addMonths(c,n){const d=carrier(c);const day=d.getUTCDate();d.setUTCDate(1);
  d.setUTCMonth(d.getUTCMonth()+n);
  const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
  d.setUTCDate(Math.min(day,last));return fromC(d)}

const fc=new Map();
function fmtFor(tz){let f=fc.get(tz);if(!f){f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,
  year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});fc.set(tz,f)}return f}
function utcToCivil(i,tz){const p=fmtFor(tz).formatToParts(i);const g=t=>+p.find(x=>x.type===t).value;
  return{y:g('year'),m:g('month'),d:g('day'),h:g('hour'),min:g('minute')}}
function offsetAt(i,tz){const c=utcToCivil(i,tz);
  return Date.UTC(c.y,c.m-1,c.d,c.h,c.min)-(i.getTime()-i.getTime()%60000)}
function civilToUtc(c,tz){const n=Date.UTC(c.y,c.m-1,c.d,c.h,c.min);
  const o1=offsetAt(new Date(n),tz);let t=n-o1;const o2=offsetAt(new Date(t),tz);
  if(o2!==o1)t=n-o2;return new Date(t)}

const LONG =new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const SHORT=new Intl.DateTimeFormat('pl-PL',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const DAYMON=new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'long',timeZone:'UTC'});

const start=()=>({y:+YEARS[state.y],m:state.mo+1,d:state.d+1,
  h:state.allDay?0:+HOURS[state.h],min:state.allDay?0:+MINUTES[state.mi]});

function nextStarts(limit){
  const s=start(),rep=REPEAT[state.rep];
  if(!rep.rrule)return[s];
  const freq=/FREQ=(\w+)/.exec(rep.rrule)[1];
  const iv=+((/INTERVAL=(\d+)/.exec(rep.rrule)||[])[1]||1);
  const out=[];
  for(let n=0;n<limit;n++){
    if(freq==='DAILY')out.push(addDays(s,n*iv));
    else if(freq==='WEEKLY')out.push(addDays(s,7*n*iv));
    else if(freq==='MONTHLY')out.push(addMonths(s,n*iv));
    else out.push(addMonths(s,12*n*iv));
  }
  return out;
}

function render(){
  const title=$('title').value.trim();
  const rep=REPEAT[state.rep];
  const rem=REMIND[state.rem];
  const s=start();
  const dow=carrier(s).getUTCDay();

  /* Powtarzanie bierze rytm z daty — pokazujemy to wprost,
     żeby nie trzeba było się domyślać. */
  let when;
  if(!rep.rrule){
    when=LONG.format(carrier(s));
  } else {
    const freq=/FREQ=(\w+)/.exec(rep.rrule)[1];
    when=rep.label.toLowerCase();
    if(freq==='WEEKLY')when+=' '+DOW_PLURAL[dow];
    else if(freq==='MONTHLY')when+=', '+s.d+' dnia';
    else if(freq==='YEARLY')when+=', '+DAYMON.format(carrier(s));
    when+=' — od '+LONG.format(carrier(s));
  }

  $('sentence').innerHTML='<span class="t">'+(title||'Bez nazwy')+'</span> — '+when+
    (state.allDay?', cały dzień':', '+HOURS[state.h]+':'+MINUTES[state.mi]);

  $('sub').textContent=(rem.min===null?'Bez przypomnienia'
    :rem.min===0?'Przypomnienie w momencie zdarzenia'
    :'Przypomnienie '+rem.label.toLowerCase())+' · waga: '+WEIGHTS[state.weight].toLowerCase();

  const starts=nextStarts(4);
  let prev=null,rows='';
  for(const c of starts){
    const inst=state.allDay?carrier(c):civilToUtc(c,TZ);
    const off=state.allDay?null:offsetAt(inst,TZ)/3600000;
    const shift=off!==null&&prev!==null&&off!==prev;
    rows+='<li><span>'+SHORT.format(carrier(c))+(state.allDay?'':' · '+pad(c.h)+':'+pad(c.min))+'</span>'+
      '<span class="u"'+(shift?' style="color:var(--accent)"':'')+'>'+
      (state.allDay?'—':inst.toISOString().slice(11,16)+'Z')+'</span></li>';
    prev=off;
  }
  $('next').innerHTML=rep.rrule?'<li class="hd">Najbliższe</li>'+rows:'';

  $('readout').textContent='start: '+s.y+'-'+pad(s.m)+'-'+pad(s.d)+
    (state.allDay?'':'T'+pad(s.h)+':'+pad(s.min))+
    '  ·  rrule: '+(rep.rrule||'—')+
    '  ·  reminder: '+(rem.min===null?'—':rem.min)+
    '  ·  priority: '+state.weight;

  $('save').disabled=!title;
}

$('save').addEventListener('click',()=>{
  const b=$('save');b.textContent='Zapisano';b.disabled=true;
  setTimeout(()=>{b.textContent='Zapisz';render()},1400);
});

/* Wybór motywu jest funkcją aplikacji (README: Personalizacja → motywy).
   W wersji docelowej zapisuje się w user_settings.theme — kolumna już jest
   w schemacie i jest objęta synchronizacją, więc motyw podąża za użytkownikiem
   między telefonem a komputerem. Tutaj trzymany w pamięci. */
$('themes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  state.theme=b.dataset.t;
  document.documentElement.dataset.theme=state.theme;
  [...$('themes').children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
});

render();
</script>
</body>
</html>
